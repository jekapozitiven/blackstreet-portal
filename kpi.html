<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI · Black Street</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTAwIiBoZWlnaHQ9IjUwMCIgdmlld0JveD0iMCAwIDUwMCA1MDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMjUwIiBjeT0iMjUwIiByPSIyNTAiIGZpbGw9IiMwYTBhMGEiLz48dGV4dCB4PSIyNTAiIHk9IjI3MCIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsc2VyaWYiIGZvbnQtc2l6ZT0iMTgwIiBmb250LXdlaWdodD0iOTAwIiBmaWxsPSIjYzlhODRjIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIj5CPC90ZXh0Pjwvc3ZnPg==">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000000;--surface:#0e0e0e;--surface2:#161616;--surface3:#1e1e1e;--border:#272727;--gold:#c9a84c;--gold2:#f0d080;--gold-dim:rgba(201,168,76,0.15);--text:#f0f0f5;--muted:#7a7a9a;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:20px;font-weight:800;color:var(--text);letter-spacing:-1px}
.logo span{color:#f0ff00}
.nav-tabs{display:flex;gap:4px}
.nav-tab{background:transparent;border:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all .2s}
.nav-tab:hover{color:var(--text);background:var(--surface2)}
.nav-tab.active{background:var(--gold-dim);color:var(--gold)}
.page{display:none;padding:28px;max-width:1200px;margin:0 auto}
.page.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:18px}
.month-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.month-label{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.5px}
.mgr-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.mgr-tab{background:var(--surface2);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:7px 18px;cursor:pointer;transition:all .2s}
.mgr-tab.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:18px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-color,var(--gold))}
.kpi-name{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:10px}
.kpi-values{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.kpi-fact{font-family:'Montserrat',sans-serif;font-size:28px;font-weight:800;line-height:1}
.kpi-plan{font-size:13px;color:var(--muted)}
.kpi-progress-wrap{display:flex;align-items:center;gap:8px}
.kpi-bar{flex:1;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden}
.kpi-bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.kpi-pct{font-size:12px;font-weight:700;min-width:36px;text-align:right}
.kpi-adj{font-size:11px;color:var(--muted);margin-top:6px}
.ov-table{width:100%;border-collapse:collapse;font-size:13px}
.ov-table th{text-align:left;padding:10px 14px;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);white-space:nowrap}
.ov-table td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.ov-table tr:last-child td{border-bottom:none}
.ov-table tr:hover td{background:var(--surface2)}
.prog{display:flex;align-items:center;gap:8px}
.prog-bar{flex:1;height:4px;background:var(--surface3);border-radius:2px;min-width:50px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px}
.prog-val{font-size:12px;font-weight:700;min-width:32px;text-align:right}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--gold)}
select option{background:var(--surface2)}
.form-row{display:flex;gap:12px;flex-wrap:wrap}
.form-group{flex:1;min-width:140px;margin-bottom:14px}
.btn{background:var(--gold);color:#000;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:10px 22px;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-sm{font-size:12px;padding:7px 14px;border-radius:7px}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);font-weight:500}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-top:10px}
.alert.success{background:rgba(74,222,128,.12);color:var(--green);border:1px solid rgba(74,222,128,.25)}
.alert.error{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.25)}
.refusal-banner{background:linear-gradient(135deg,rgba(201,168,76,.08),rgba(201,168,76,.03));border:1px solid rgba(201,168,76,.2);border-radius:10px;padding:16px 20px;display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.log-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:flex-start;flex-wrap:wrap}
.log-item:last-child{border-bottom:none}
.log-date{color:var(--muted);min-width:80px;font-size:12px}
@media(max-width:640px){.header{padding:0 14px}.nav-tabs{gap:2px}.nav-tab{padding:7px 10px;font-size:12px}.page{padding:14px}.kpi-grid{grid-template-columns:1fr 1fr;gap:10px}}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo" style="text-decoration:none;cursor:pointer">BLACK STREET <span style="color:#f0ff00">//</span></a>
  <nav class="nav-tabs">
    <a href="index.html" class="nav-tab" style="text-decoration:none;display:inline-flex;align-items:center">🏠 Головна</a>
    <button class="nav-tab active" onclick="showPage('dashboard',this)">📊 Дашборд</button>
    <button class="nav-tab" onclick="showPage('enter',this)">✏️ Внести дані</button>
    <button class="nav-tab" onclick="showPage('plan',this)">🎯 Плани</button>
    <button class="nav-tab" onclick="showPage('history',this)">📋 Історія</button>
  </nav>
</header>

<!-- DASHBOARD -->
<div class="page active" id="page-dashboard">
  <div class="month-bar">
    <span class="month-label" id="dash-month-label"></span>
    <select id="dash-month" onchange="renderDashboard()"></select>
  </div>
  <div class="refusal-banner">
    <span style="font-size:13px;color:var(--muted)">⚙️ Коефіцієнт відмов на пошті:</span>
    <div style="display:flex;align-items:center;gap:8px">
      <input type="number" id="refusal-rate" min="0" max="100" value="30" style="width:75px;text-align:center;font-weight:700;color:var(--gold)" onchange="saveRefusalRate();renderDashboard()"/>
      <span style="color:var(--muted);font-size:13px">%</span>
    </div>
    <span style="font-size:12px;color:var(--muted)">Сума прибутку коригується автоматично (тільки цей показник)</span>
  </div>
  <div class="mgr-tabs" id="dash-mgr-tabs"></div>
  <div class="kpi-grid" id="dash-kpi-grid"></div>
  <div class="card">
    <div class="card-title">Порівняння менеджерів</div>
    <div style="overflow-x:auto"><table class="ov-table" id="overview-table"></table></div>
  </div>
</div>

<!-- ENTER DATA -->
<div class="page" id="page-enter">
  <div class="card">
    <div class="card-title">✏️ Внести щоденні дані</div>
    <div class="form-row">
      <div class="form-group"><label>Менеджер</label>
        <select id="e-manager"><option>Марина</option><option>Поліна</option><option>Софія</option></select></div>
      <div class="form-group"><label>Дата</label><input type="date" id="e-date"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>% Апрув</label><input type="number" id="e-approve" placeholder="напр. 78" min="0" max="100" step="0.1"/></div>
      <div class="form-group"><label>% Допродажів</label><input type="number" id="e-upsell" placeholder="напр. 35" min="0" max="100" step="0.1"/></div>
      <div class="form-group"><label>Сума прибутку (грн)</label><input type="number" id="e-profit" placeholder="напр. 15000" min="0"/></div>
      <div class="form-group"><label>% Успішних замовлень</label><input type="number" id="e-success" placeholder="напр. 65" min="0" max="100" step="0.1"/></div>
    </div>
    <button class="btn" onclick="saveEntry()">Зберегти</button>
    <div id="e-msg"></div>
  </div>
  <div class="card"><div class="card-title">Останні записи</div><div id="recent-entries"></div></div>
</div>

<!-- PLANS -->
<div class="page" id="page-plan">
  <div class="card">
    <div class="card-title">🎯 Встановити план на місяць</div>
    <div class="form-row">
      <div class="form-group"><label>Менеджер</label>
        <select id="p-manager"><option>Марина</option><option>Поліна</option><option>Софія</option></select></div>
      <div class="form-group"><label>Місяць</label><input type="month" id="p-month"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>% Апрув (план)</label><input type="number" id="p-approve" placeholder="напр. 80" min="0" max="100" step="0.1"/></div>
      <div class="form-group"><label>% Допродажів (план)</label><input type="number" id="p-upsell" placeholder="напр. 40" min="0" max="100" step="0.1"/></div>
      <div class="form-group"><label>Сума прибутку (план, грн)</label><input type="number" id="p-profit" placeholder="напр. 50000" min="0"/></div>
      <div class="form-group"><label>% Успішних (план)</label><input type="number" id="p-success" placeholder="напр. 70" min="0" max="100" step="0.1"/></div>
    </div>
    <button class="btn" onclick="savePlan()">Зберегти план</button>
    <div id="p-msg"></div>
  </div>
  <div class="card"><div class="card-title">Активні плани</div><div id="plans-list"></div></div>
</div>

<!-- HISTORY -->
<div class="page" id="page-history">
  <div class="card">
    <div class="form-row" style="margin-bottom:0">
      <div class="form-group"><label>Менеджер</label>
        <select id="h-manager" onchange="renderHistory()">
          <option value="all">Всі</option><option>Марина</option><option>Поліна</option><option>Софія</option>
        </select></div>
      <div class="form-group"><label>Місяць</label><select id="h-month" onchange="renderHistory()"></select></div>
    </div>
  </div>
  <div class="card"><div class="card-title">Записи</div><div id="history-list"></div></div>
</div>

<script>
const MANAGERS=['Марина','Поліна','Софія'];
const KPI=[
  {key:'approve',label:'% Апрув',unit:'%',color:'#60a5fa',adj:false},
  {key:'upsell',label:'% Допродажів',unit:'%',color:'#c084fc',adj:false},
  {key:'profit',label:'Сума прибутку',unit:' грн',color:'#c9a84c',adj:true},
  {key:'success',label:'% Успішних',unit:'%',color:'#4ade80',adj:false},
];

const getEntries=()=>{try{return JSON.parse(localStorage.getItem('kpi_e')||'[]')}catch{return[]}};
const saveEntries=d=>localStorage.setItem('kpi_e',JSON.stringify(d));
const getPlans=()=>{try{return JSON.parse(localStorage.getItem('kpi_p')||'[]')}catch{return[]}};
const savePlans=d=>localStorage.setItem('kpi_p',JSON.stringify(d));
const getRefusal=()=>parseFloat(localStorage.getItem('kpi_r')||'30');
const saveRefusalRate=()=>localStorage.setItem('kpi_r',document.getElementById('refusal-rate').value);

let activeMgr='all';

function showPage(page,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  el.classList.add('active');
  if(page==='dashboard')renderDashboard();
  if(page==='enter')renderRecentEntries();
  if(page==='plan')renderPlansList();
  if(page==='history')renderHistory();
}

function initSelects(){
  const now=new Date();
  const opts=[];
  for(let i=0;i<6;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const val=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const lbl=d.toLocaleString('uk',{month:'long',year:'numeric'});
    opts.push({val,lbl});
  }
  ['dash-month','h-month'].forEach(id=>{
    const s=document.getElementById(id);
    if(!s)return;
    s.innerHTML=opts.map((o,i)=>`<option value="${o.val}"${i===0?' selected':''}>${o.lbl}</option>`).join('');
  });
  document.getElementById('p-month').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('e-date').value=new Date().toISOString().split('T')[0];
  document.getElementById('refusal-rate').value=getRefusal();
}

function fmtN(n,unit){
  if(unit===' грн')return Math.round(n).toLocaleString('uk')+' грн';
  return parseFloat(n).toFixed(1)+unit;
}

function pctColor(p){return p>=100?'var(--green)':p>=70?'var(--yellow)':'var(--red)';}

function adj(val,key,refusal){
  const k=KPI.find(x=>x.key===key);
  return(k&&k.adj)?val*(1-refusal/100):val;
}

function getFactAvg(manager,month){
  const es=getEntries().filter(e=>e.manager===manager&&e.date.startsWith(month));
  if(!es.length)return null;
  const r={entriesCount:es.length,lastDate:es.slice().sort((a,b)=>b.date.localeCompare(a.date))[0].date};
  KPI.forEach(k=>{
    const vs=es.map(e=>parseFloat(e[k.key]||0)).filter(v=>!isNaN(v)&&v>0);
    r[k.key]=vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:0;
  });
  return r;
}

function getPlan(manager,month){return getPlans().find(p=>p.manager===manager&&p.month===month)||null;}

function renderDashboard(){
  const month=document.getElementById('dash-month').value;
  const refusal=getRefusal();
  document.getElementById('refusal-rate').value=refusal;
  const d=new Date(month+'-01');
  document.getElementById('dash-month-label').textContent=d.toLocaleString('uk',{month:'long',year:'numeric'});

  // tabs
  document.getElementById('dash-mgr-tabs').innerHTML=
    [{key:'all',label:'Всі'},...MANAGERS.map(m=>({key:m,label:m}))].map(t=>
      `<button class="mgr-tab${activeMgr===t.key?' active':''}" onclick="setMgrTab('${t.key}')">${t.label}</button>`
    ).join('');

  // KPI cards (single manager)
  const grid=document.getElementById('dash-kpi-grid');
  if(activeMgr!=='all'){
    grid.style.display='grid';
    const fact=getFactAvg(activeMgr,month);
    const plan=getPlan(activeMgr,month);
    grid.innerHTML=KPI.map(kpi=>{
      const raw=fact?fact[kpi.key]:null;
      const af=raw!==null?(kpi.adj?adj(raw,kpi.key,refusal):raw):null;
      const pv=plan?parseFloat(plan[kpi.key]||0):null;
      const pct=(af!==null&&pv)?Math.min(Math.round(af/pv*100),999):null;
      const col=pct!==null?pctColor(pct):'var(--muted)';
      const remaining=pv&&af!==null?pv-af:null;
      return`<div class="kpi-card" style="--accent-color:${kpi.color}">
        <div class="kpi-name">${kpi.label}${kpi.adj?' <span style="color:var(--gold);font-size:10px">~скор.</span>':''}</div>
        <div class="kpi-values">
          <span class="kpi-fact" style="color:${kpi.color}">${af!==null?fmtN(af,kpi.unit):'—'}</span>
          ${pv?`<span class="kpi-plan">/ ${fmtN(pv,kpi.unit)}</span>`:''}
        </div>
        ${pct!==null?`<div class="kpi-progress-wrap">
          <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.min(pct,100)}%;background:${col}"></div></div>
          <span class="kpi-pct" style="color:${col}">${pct}%</span>
        </div>
        ${kpi.key==='profit'&&remaining!==null?`<div class="kpi-adj" style="margin-top:8px">
          ${remaining>0
            ?`До плану: <b style="color:var(--yellow)">+${Math.round(remaining).toLocaleString('uk')} грн</b>`
            :`<b style="color:var(--green)">✅ План виконано на ${pct}%</b>`}
        </div>`:''}
        `:'<div style="font-size:12px;color:var(--muted)">план не встановлено</div>'}
        ${kpi.adj&&raw!==null?`<div class="kpi-adj">До коригування: ${fmtN(raw,kpi.unit)}</div>`:''}
        ${fact?`<div class="kpi-adj">Оновлено: ${fact.lastDate} · ${fact.entriesCount} зап.</div>`:''}
      </div>`;
    }).join('');
  } else {
    grid.style.display='none';
  }

  // Overview table
  const mgrs=activeMgr==='all'?MANAGERS:[activeMgr];
  document.getElementById('overview-table').innerHTML=`
    <thead><tr><th>Менеджер</th>${KPI.map(k=>`<th>${k.label}</th>`).join('')}<th>Записів</th></tr></thead>
    <tbody>${mgrs.map(m=>{
      const fact=getFactAvg(m,month);
      const plan=getPlan(m,month);
      return`<tr>
        <td><strong>${m}</strong>${fact?`<div style="font-size:11px;color:var(--muted);margin-top:2px">ост. ${fact.lastDate}</div>`:''}</td>
        ${KPI.map(kpi=>{
          const raw=fact?fact[kpi.key]:null;
          const af=raw!==null?(kpi.adj?adj(raw,kpi.key,refusal):raw):null;
          const pv=plan?parseFloat(plan[kpi.key]||0):null;
          const pct=(af!==null&&pv)?Math.min(Math.round(af/pv*100),999):null;
          const col=pct!==null?pctColor(pct):'var(--muted)';
          const remaining=pv&&af!==null?pv-af:null;
          return`<td>${af!==null?`
            <div style="font-weight:600;color:${kpi.color}">${fmtN(af,kpi.unit)}</div>
            ${pct!==null?`<div class="prog" style="margin-top:5px">
              <div class="prog-bar"><div class="prog-fill" style="width:${Math.min(pct,100)}%;background:${col}"></div></div>
              <span class="prog-val" style="color:${col}">${pct}%</span>
            </div>
            ${kpi.key==='profit'&&remaining!==null?`<div style="font-size:11px;margin-top:3px;color:${remaining>0?'var(--yellow)':'var(--green)'}">
              ${remaining>0?`ще +${Math.round(remaining).toLocaleString('uk')} грн`:`✅ виконано`}
            </div>`:''}
            <div style="font-size:11px;color:var(--muted);margin-top:2px">план: ${fmtN(pv,kpi.unit)}</div>`
            :'<div style="font-size:11px;color:var(--muted)">без плану</div>'}
          `:'<span style="color:var(--muted)">—</span>'}</td>`;
        }).join('')}
        <td style="color:var(--muted)">${fact?fact.entriesCount:'—'}</td>
      </tr>`;
    }).join('')}</tbody>`;
}

function setMgrTab(key){activeMgr=key;renderDashboard();}

function saveEntry(){
  const manager=document.getElementById('e-manager').value;
  const date=document.getElementById('e-date').value;
  const approve=document.getElementById('e-approve').value;
  const upsell=document.getElementById('e-upsell').value;
  const profit=document.getElementById('e-profit').value;
  const success=document.getElementById('e-success').value;
  const msgEl=document.getElementById('e-msg');
  if(!date){msgEl.innerHTML='<div class="alert error">Виберіть дату</div>';return;}
  if(!approve&&!upsell&&!profit&&!success){msgEl.innerHTML='<div class="alert error">Заповніть хоча б одне поле</div>';return;}
  const entries=getEntries();
  const idx=entries.findIndex(e=>e.manager===manager&&e.date===date);
  const entry={manager,date,approve,upsell,profit,success,updatedAt:new Date().toISOString()};
  if(idx!==-1)entries[idx]=entry;else entries.push(entry);
  saveEntries(entries);
  msgEl.innerHTML='<div class="alert success">✅ Збережено!</div>';
  setTimeout(()=>msgEl.innerHTML='',3000);
  renderRecentEntries();
}

function renderRecentEntries(){
  const entries=getEntries().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  const el=document.getElementById('recent-entries');
  if(!entries.length){el.innerHTML='<div style="color:var(--muted);font-size:13px">Записів немає</div>';return;}
  el.innerHTML=entries.map(e=>`
    <div class="log-item">
      <span class="log-date">${e.date}</span>
      <span style="font-weight:600;min-width:70px">${e.manager}</span>
      <span style="color:var(--muted);font-size:12px;flex:1">
        Апрув: <b style="color:var(--text)">${e.approve||'—'}%</b> ·
        Допр: <b style="color:var(--text)">${e.upsell||'—'}%</b> ·
        Прибуток: <b style="color:var(--gold)">${e.profit?parseInt(e.profit).toLocaleString('uk')+' грн':'—'}</b> ·
        Успішні: <b style="color:var(--text)">${e.success||'—'}%</b>
      </span>
      <button class="btn btn-sm btn-ghost" style="font-size:11px" onclick="deleteEntry('${e.manager}','${e.date}')">✕</button>
    </div>`).join('');
}

function deleteEntry(manager,date){
  if(!confirm('Видалити?'))return;
  saveEntries(getEntries().filter(e=>!(e.manager===manager&&e.date===date)));
  renderRecentEntries();
}

function savePlan(){
  const manager=document.getElementById('p-manager').value;
  const month=document.getElementById('p-month').value;
  const msgEl=document.getElementById('p-msg');
  if(!month){msgEl.innerHTML='<div class="alert error">Виберіть місяць</div>';return;}
  const plans=getPlans();
  const idx=plans.findIndex(p=>p.manager===manager&&p.month===month);
  const plan={manager,month,
    approve:document.getElementById('p-approve').value,
    upsell:document.getElementById('p-upsell').value,
    profit:document.getElementById('p-profit').value,
    success:document.getElementById('p-success').value
  };
  if(idx!==-1)plans[idx]=plan;else plans.push(plan);
  savePlans(plans);
  msgEl.innerHTML='<div class="alert success">✅ План збережено!</div>';
  setTimeout(()=>msgEl.innerHTML='',3000);
  renderPlansList();
}

function renderPlansList(){
  const plans=getPlans().sort((a,b)=>b.month.localeCompare(a.month));
  const el=document.getElementById('plans-list');
  if(!plans.length){el.innerHTML='<div style="color:var(--muted);font-size:13px">Планів немає</div>';return;}
  el.innerHTML=`<table class="ov-table"><thead><tr><th>Менеджер</th><th>Місяць</th>${KPI.map(k=>`<th>${k.label}</th>`).join('')}<th></th></tr></thead><tbody>
  ${plans.map(p=>{
    const d=new Date(p.month+'-01');
    return`<tr>
      <td><strong>${p.manager}</strong></td>
      <td style="color:var(--muted)">${d.toLocaleString('uk',{month:'short',year:'numeric'})}</td>
      ${KPI.map(k=>`<td style="color:${k.color}">${p[k.key]?fmtN(parseFloat(p[k.key]),k.unit):'—'}</td>`).join('')}
      <td><button class="btn btn-sm btn-ghost" style="font-size:11px" onclick="deletePlan('${p.manager}','${p.month}')">✕</button></td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

function deletePlan(manager,month){
  if(!confirm('Видалити план?'))return;
  savePlans(getPlans().filter(p=>!(p.manager===manager&&p.month===month)));
  renderPlansList();
}

function renderHistory(){
  const manager=document.getElementById('h-manager').value;
  const month=document.getElementById('h-month').value;
  const refusal=getRefusal();
  let entries=getEntries().filter(e=>e.date.startsWith(month));
  if(manager!=='all')entries=entries.filter(e=>e.manager===manager);
  entries.sort((a,b)=>b.date.localeCompare(a.date));
  const el=document.getElementById('history-list');
  if(!entries.length){el.innerHTML='<div style="color:var(--muted);font-size:13px">Записів немає</div>';return;}
  el.innerHTML=entries.map(e=>`
    <div class="log-item">
      <span class="log-date">${e.date}</span>
      <span style="font-weight:600;min-width:70px">${e.manager}</span>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px">
        ${KPI.map(kpi=>{
          const raw=parseFloat(e[kpi.key]||0);
          if(!e[kpi.key])return'';
          const af=kpi.adj?adj(raw,kpi.key,refusal):raw;
          return`<span style="color:var(--muted)">${kpi.label}: <b style="color:${kpi.color}">${fmtN(af,kpi.unit)}</b>${kpi.adj?` <span style="color:var(--gold);font-size:10px">~скор.</span>`:''}</span>`;
        }).filter(Boolean).join('')}
      </div>
    </div>`).join('');
}

initSelects();
renderDashboard();
</script>
</body>
</html>
