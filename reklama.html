<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BBB CLUB // Реклама</title>
<style>
  :root{
    --bg:#0f1216; --card:#171b21; --line:#262c35; --text:#e6e9ee; --muted:#8b95a3;
    --accent:#4f8cff; --green:#22c55e; --red:#ef4444; --orange:#f59e0b; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px}
  .wrap{max-width:1280px;margin:0 auto;padding:18px}
  h1{font-size:20px;margin:0 0 2px} .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
  .bar label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
  input[type=date]{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font-size:13px}
  button{background:var(--accent);border:0;color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
  button.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
  button.ghost.on{border-color:var(--accent);color:#fff}
  select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 7px;font-size:12px;max-width:230px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .kpi .v{font-size:20px;font-weight:700;margin-top:4px;font-family:var(--mono)}
  .shop{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 10px;margin-bottom:16px;overflow-x:auto}
  .shop h2{font-size:15px;margin:10px 12px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .shop h2 .t{color:var(--muted);font-size:12px;font-weight:500;font-family:var(--mono)}
  table{width:100%;border-collapse:collapse;min-width:820px}
  th,td{padding:7px 10px;text-align:right;border-top:1px solid var(--line);font-family:var(--mono);font-size:13px;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-top:0}
  td.name,th.name{text-align:left;font-family:inherit;white-space:normal}
  tr.tot td{border-top:2px solid var(--line);font-weight:700}
  tr.nocat td.name{color:var(--orange)}
  tr.warn td{color:var(--orange)}
  .pct{color:var(--muted)} .g{color:var(--green)} .r{color:var(--red)}
  .note{color:var(--muted);font-size:12px;margin:8px 2px}
  td.name.exp{cursor:pointer;user-select:none} td.name.exp:hover{color:var(--accent)}
  .caret{display:inline-block;width:12px;color:var(--muted);font-size:11px;transition:transform .12s}
  tr.open .caret{transform:rotate(90deg);color:var(--accent)}
  tr.camp{cursor:pointer} tr.camp td{background:#1b2028;font-weight:700;border-top:2px solid var(--line)}
  tr.camp:hover td{background:#20262f}
  tr.camp td.name{color:var(--text);user-select:none}
  td.name.sub{padding-left:28px}
  tr.detail td{background:#12151a;border-top:0;padding:2px 12px 10px}
  .arts{display:flex;flex-wrap:wrap;gap:6px;white-space:normal}
  .chip{background:#0f1216;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-family:var(--mono);font-size:12px}
  .chip b{color:var(--muted);font-weight:400;margin-left:4px}
  .maprow{display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line)}
  .maprow .gname{flex:1;font-size:13px} .maprow .gb{font-family:var(--mono);color:var(--muted);width:120px;text-align:right}
  .empty{color:var(--muted);font-size:12px;padding:8px 12px}
  @media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Реклама — категорії та бюджет</h1>
  <div class="sub">Категорії = ті, що реально рекламуються в Google Ads (типи товару в кампаніях, по кожному магазину). Заявки/маржа з сайтів привʼязуються до них у вкладці «Прив'язка».</div>

  <div class="bar">
    <label>Від<input type="date" id="from"></label>
    <label>До<input type="date" id="to"></label>
    <button id="apply">Показати</button>
    <button class="ghost" id="d7">7 днів</button>
    <button class="ghost" id="d30">30 днів</button>
    <button class="ghost" id="all">Весь період</button>
    <span style="flex:1"></span>
    <button class="ghost on" id="vTable">Таблиця</button>
    <button class="ghost" id="vMap">Прив'язка</button>
    <button class="ghost" id="reload">↻</button>
  </div>

  <div id="tableView">
    <div class="kpis" id="kpis"></div>
    <div id="shops"></div>
  </div>
  <div id="mapView" style="display:none"></div>
  <div class="note" id="status">Завантаження…</div>
</div>

<script>
const FB = "https://owner-portal-1649e-default-rtdb.europe-west1.firebasedatabase.app";
const ORDER = ["Сайт-Black-street","Сайт-Bonna-shop","Хор-Blink"];
// ADS[src][day][workerCatKey]={cat,leads,approved,sum,margin,upsSum}  — наші замовлення по категоріях воркера
// GCAT[src][gKey]={name,"дата":витрати}                               — рекламовані категорії Google + бюджет
// MAP[src][workerCatKey]=gKey                                          — наша категорія замовлення -> рекламована категорія Google
// ARTS[src][workerCatKey]={артикул:кількість}                         — артикули по категорії (для розкриття рядка)
// GCATCAMP[src][gKey]={cat,camp,lastDate}                              — поточна кампанія категорії (авто з Google Ads)
let ADS = {}, GCAT = {}, MAP = {}, ARTS = {}, GCATCAMP = {};
let ROWART = {}, ROWUID = 0;   // uid рядка -> [[артикул,кількість]...] для розкриття

const fmt = n => Math.round(n||0).toLocaleString("uk-UA");
const el = id => document.getElementById(id);
const enc = encodeURIComponent;

async function loadData(){
  el("status").textContent = "Завантаження…";
  const [a,g,m,ar,cc] = await Promise.all([
    fetch(FB+"/shop-reports/ads.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-google-cat.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-map2.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-articles.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-google-catcamp.json").then(r=>r.json()),
  ]);
  ADS=a||{}; GCAT=g||{}; MAP=m||{}; ARTS=ar||{}; GCATCAMP=cc||{};
  const [mn,mx]=bounds();
  if(mn&&!el("from").value) el("from").value=mn;
  if(mx&&!el("to").value) el("to").value=mx;
  render();
}

function bounds(){
  let mn=null,mx=null;
  for(const s in ADS) for(const d in ADS[s]){ if(!mn||d<mn)mn=d; if(!mx||d>mx)mx=d; }
  for(const s in GCAT) for(const k in GCAT[s]) for(const d in GCAT[s][k]){ if(d==="name")continue; if(!mn||d<mn)mn=d; if(!mx||d>mx)mx=d; }
  return [mn,mx];
}
function sources(){
  const s=new Set([...Object.keys(ADS),...Object.keys(GCAT)]);
  return [...s].sort((a,b)=>{const ia=ORDER.indexOf(a),ib=ORDER.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib);});
}
function inRange(d,f,t){ return (!f||d>=f)&&(!t||d<=t); }
function sumCost(obj,f,t){ let s=0; for(const k in obj){ if(k==="name")continue; if(inRange(k,f,t)) s+=+obj[k]||0; } return s; }

// рекламовані категорії магазину (з Google Ads) — тільки вони, окремо по магазину
function advCats(src){
  const g=GCAT[src]||{};
  return Object.keys(g).map(k=>({key:k,name:g[k].name||k})).sort((a,b)=>a.name.localeCompare(b.name,"uk"));
}
// наші категорії замовлень за період: workerKey -> {key,cat,leads,approved,sum,margin,upsSum}
function aggCats(src,f,t){
  const out={}, days=(ADS[src]||{});
  for(const day in days){ if(!inRange(day,f,t))continue;
    for(const ck in days[day]){ const c=days[day][ck];
      const o=out[ck]||(out[ck]={key:ck,cat:c.cat||ck,leads:0,approved:0,sum:0,margin:0,upsSum:0});
      o.leads+=+c.leads||0;o.approved+=+c.approved||0;o.sum+=+c.sum||0;o.margin+=+c.margin||0;o.upsSum+=+c.upsSum||0;
    }}
  return out;
}

function render(){
  const f=el("from").value, t=el("to").value;
  if(el("mapView").style.display!=="none"){ renderMap(f,t); }
  else { renderTable(f,t); }
  el("status").textContent="Оновлено: "+new Date().toLocaleString("uk-UA");
}

function mergeArticles(src,keys){
  const acc={}, a=(ARTS[src]||{});
  for(const k of keys){ const d=a[k]; if(!d) continue;
    // формат — список пар [артикул,кількість]; підтримуємо і старий словник
    const items = Array.isArray(d) ? d : Object.values(d);
    for(const pr of items){
      if(Array.isArray(pr)){ const sku=pr[0], c=+pr[1]||0; if(sku) acc[sku]=(acc[sku]||0)+c; }
      else if(pr && typeof pr==="object"){ const sku=pr[0]||pr.sku; if(sku) acc[sku]=(acc[sku]||0)+(+pr[1]||+pr.n||0); }
    }
  }
  return Object.entries(acc).sort((x,y)=>y[1]-x[1]);
}
function renderTable(f,t){
  const srcs=sources();
  const grand={leads:0,approved:0,margin:0,budget:0,ups:0};
  ROWART={}; ROWUID=0;
  let html="";
  for(const src of srcs){
    const adv=advCats(src), g=(GCAT[src]||{}), m=(MAP[src]||{}), cc=(GCATCAMP[src]||{});
    const orders=aggCats(src,f,t);
    // база рядків = рекламовані Google-категорії
    const byAdv={};
    for(const a of adv){ byAdv[a.key]={key:a.key,cat:a.name,leads:0,approved:0,sum:0,margin:0,upsSum:0,budget:sumCost(g[a.key],f,t),wkeys:[]}; }
    // розкидати наші замовлення по рекламованих категоріях
    const unmapped={key:"_noads",cat:"Замовлення без реклами",leads:0,approved:0,sum:0,margin:0,upsSum:0,budget:0,wkeys:[]};
    for(const ck in orders){ const o=orders[ck]; const tgt=m[ck];
      const dst=(tgt&&byAdv[tgt])?byAdv[tgt]:unmapped;
      dst.leads+=o.leads;dst.approved+=o.approved;dst.sum+=o.sum;dst.margin+=o.margin;dst.upsSum+=o.upsSum;dst.wkeys.push(ck);
    }
    let rows=Object.values(byAdv).map(r=>({...r,cpl:r.leads?r.budget/r.leads:0,cpa:r.approved?r.budget/r.approved:0,net:r.margin-r.budget}));
    if(unmapped.leads||unmapped.margin){ unmapped.cpl=0;unmapped.cpa=0;unmapped.net=unmapped.margin; }
    const hasUnmapped=unmapped.leads||unmapped.margin;

    const allR=rows.concat(hasUnmapped?[unmapped]:[]);
    const tot=allR.reduce((a,r)=>({leads:a.leads+r.leads,approved:a.approved+r.approved,sum:a.sum+r.sum,margin:a.margin+r.margin,upsSum:a.upsSum+r.upsSum,budget:a.budget+r.budget}),
      {leads:0,approved:0,sum:0,margin:0,upsSum:0,budget:0});
    grand.leads+=tot.leads;grand.approved+=tot.approved;grand.margin+=tot.margin;grand.budget+=tot.budget;grand.ups+=tot.upsSum;
    const tpct=tot.leads?Math.round(tot.approved/tot.leads*100):0;
    const totRow=rowHtml({cat:"Разом",leads:tot.leads,approved:tot.approved,margin:tot.margin,budget:tot.budget,cpl:tot.leads?tot.budget/tot.leads:0,cpa:tot.approved?tot.budget/tot.approved:0,net:tot.margin-tot.budget,upsSum:tot.upsSum},true);

    const grouped = Object.keys(cc).length>0;
    let body;
    if(!adv.length){
      body=`<tr><td class="empty" colspan="9">Немає рекламованих категорій. Додай Google Ads-скрипт у цей акаунт — категорії підтягнуться самі.</td></tr>`;
    } else if(grouped){
      // групуємо категорії за ПОТОЧНОЮ кампанією (з ads-google-catcamp)
      const groups={};
      for(const r of rows){
        const camp=(cc[r.key]&&cc[r.key].camp)||"Без кампанії";
        const gr=groups[camp]||(groups[camp]={camp,rows:[],leads:0,approved:0,margin:0,budget:0,upsSum:0});
        gr.rows.push(r); gr.leads+=r.leads;gr.approved+=r.approved;gr.margin+=r.margin;gr.budget+=r.budget;gr.upsSum+=r.upsSum;
      }
      const gArr=Object.values(groups).sort((a,b)=>b.budget-a.budget||b.leads-a.leads);
      body=""; let ci=0;
      for(const gr of gArr){
        const cuid="c"+(ci++);
        gr.rows.sort((a,b)=>b.budget-a.budget||b.leads-a.leads);
        body+=campHtml(gr,cuid)+gr.rows.map(r=>rowHtml(r,false,src,true,cuid)).join("");
      }
      if(hasUnmapped) body+=rowHtml(unmapped,false,src,false);
      body+=totRow;
    } else {
      rows.sort((a,b)=>b.budget-a.budget||b.leads-a.leads);
      if(hasUnmapped) rows.push(unmapped);
      body=rows.map(r=>rowHtml(r,false,src)).join("")+totRow;
    }
    html+=`<div class="shop"><h2>${src}
        <span class="t">заявок ${fmt(tot.leads)} · апрув ${fmt(tot.approved)} (${tpct}%) · маржа ${fmt(tot.margin)} · бюджет ${fmt(tot.budget)} ₴</span></h2>
      <table><thead><tr>
        <th class="name">Категорія (реклама)</th><th>Заявки</th><th>Апрув</th><th>Маржа ₴</th>
        <th>Бюджет ₴</th><th>CPL</th><th>CPA</th><th>Чистими ₴</th><th>Допрод ₴</th>
      </tr></thead><tbody>${body}</tbody></table></div>`;
  }
  const gpct=grand.leads?Math.round(grand.approved/grand.leads*100):0;
  const gnet=grand.margin-grand.budget;
  el("kpis").innerHTML=`
    <div class="kpi"><div class="l">Заявки</div><div class="v">${fmt(grand.leads)}</div></div>
    <div class="kpi"><div class="l">Апрув</div><div class="v">${fmt(grand.approved)} <span class="pct" style="font-size:12px">${gpct}%</span></div></div>
    <div class="kpi"><div class="l">Маржа</div><div class="v g">${fmt(grand.margin)} ₴</div></div>
    <div class="kpi"><div class="l">Бюджет</div><div class="v">${fmt(grand.budget)} ₴</div></div>
    <div class="kpi"><div class="l">Чистими</div><div class="v ${gnet>=0?'g':'r'}">${fmt(gnet)} ₴</div></div>`;
  el("shops").innerHTML=html||"<div class='note'>Немає даних.</div>";
  attachExpand();
  attachCampToggle();
}
function attachCampToggle(){
  el("shops").querySelectorAll('tr.camp').forEach(tr=>{
    tr.onclick=()=>{
      const cuid=tr.dataset.cuid; if(!cuid)return;
      const open=!tr.classList.contains('open');
      tr.classList.toggle('open',open);
      el("shops").querySelectorAll('tr[data-camp="'+cuid+'"]').forEach(row=>{
        if(row.classList.contains('detail')){ row.style.display='none'; }  // артикули завжди згорнуті при перемиканні
        else {
          row.style.display=open?'':'none';
          if(!open) row.classList.remove('open');   // скидаємо розкриті категорії
        }
      });
    };
  });
}

function cellsHtml(r){
  const apr=r.leads?Math.round(r.approved/r.leads*100):0;
  return `<td>${fmt(r.leads)}</td>
    <td>${fmt(r.approved)} <span class="pct">${apr}%</span></td>
    <td>${fmt(r.margin)}</td>
    <td>${r.budget?fmt(r.budget):"—"}</td>
    <td>${r.budget?fmt(r.cpl):"—"}</td>
    <td>${r.budget&&r.approved?fmt(r.cpa):"—"}</td>
    <td class="${r.net>=0?'g':'r'}">${r.budget?fmt(r.net):"—"}</td>
    <td class="g">${fmt(r.upsSum)}</td>`;
}
function campHtml(gr,cuid){
  const apr=gr.leads?Math.round(gr.approved/gr.leads*100):0;
  const net=gr.margin-gr.budget;
  const n=gr.rows.length;
  return `<tr class="camp" data-cuid="${cuid}"><td class="name"><span class="caret">▸</span>${gr.camp} <span class="pct" style="font-weight:400">· ${n} катег.</span></td>
    <td>${fmt(gr.leads)}</td><td>${fmt(gr.approved)} <span class="pct">${apr}%</span></td>
    <td>${fmt(gr.margin)}</td><td>${gr.budget?fmt(gr.budget):"—"}</td><td>—</td><td>—</td>
    <td class="${net>=0?'g':'r'}">${gr.budget?fmt(net):"—"}</td><td class="g">${fmt(gr.upsSum)}</td></tr>`;
}
function rowHtml(r,isTot,src,sub,campId){
  if(isTot) return `<tr class="tot"><td class="name">${r.cat}</td>${cellsHtml(r)}</tr>`;
  const cls=(r.key==="_noads")?"nocat":"";
  const sc=sub?" sub":"";
  const dc=campId?` data-camp="${campId}"`:"";
  const hid=campId?' style="display:none"':"";
  const arts=mergeArticles(src,r.wkeys||[]);
  if(!arts.length) return `<tr class="${cls}"${dc}${hid}><td class="name${sc}">${r.cat}</td>${cellsHtml(r)}</tr>`;
  const uid="r"+(ROWUID++); ROWART[uid]=arts;
  const main=`<tr class="${cls}"${dc}${hid}><td class="name exp${sc}" data-uid="${uid}"><span class="caret">▸</span>${r.cat}</td>${cellsHtml(r)}</tr>`;
  const chips=arts.map(([sku,c])=>`<span class="chip">${sku}<b>×${c}</b></span>`).join("");
  const detail=`<tr class="detail" id="det-${uid}"${dc} style="display:none"><td colspan="9">
    <div class="arts">${chips}</div>
    <div class="note" style="margin:6px 0 0">${arts.length} артикул(ів) у цій категорії</div></td></tr>`;
  return main+detail;
}
function attachExpand(){
  el("shops").querySelectorAll("td.name.exp").forEach(td=>{
    td.onclick=()=>{
      const det=el("det-"+td.dataset.uid); if(!det)return;
      const open=det.style.display==="none";
      det.style.display=open?"":"none";
      const tr=td.parentElement; if(tr) tr.classList.toggle("open",open);
    };
  });
}

function renderMap(f,t){
  el("kpis").innerHTML="";
  const srcs=sources();
  let html=`<div style="margin:0 2px 12px"><button id="autoBtn">✨ Авто-підбір</button>
    <span class="note" style="margin-left:8px">сам зіставить наші категорії замовлень з рекламованими Google-категоріями; порожні/невірні поправ вручну</span></div>`;
  for(const src of srcs){
    const adv=advCats(src), m=(MAP[src]||{});
    const orders=aggCats(src,null,null);   // всі наші категорії за весь час — зліва
    const ocs=Object.values(orders).sort((a,b)=>b.leads-a.leads);
    const opts=adv.map(a=>`<option value="${a.key}">${a.name}</option>`).join("");
    if(!adv.length){
      html+=`<div class="shop"><h2>${src}</h2><div class="empty">Немає рекламованих категорій з Google Ads — додай скрипт у цей акаунт.</div></div>`;
      continue;
    }
    html+=`<div class="shop"><h2>${src} <span class="t">наша категорія замовлення → рекламована категорія Google</span></h2>`;
    if(!ocs.length) html+=`<div class="empty">Немає замовлень з сайту за весь період.</div>`;
    for(const oc of ocs){
      html+=`<div class="maprow">
        <div class="gname">${oc.cat}</div>
        <div class="gb">${fmt(oc.leads)} заяв.</div>
        <select data-src="${src}" data-ok="${oc.key}">
          <option value="">— не рекламується —</option>${opts}
        </select></div>`;
    }
    html+=`</div>`;
  }
  el("mapView").innerHTML=html;
  const ab=el("autoBtn"); if(ab) ab.onclick=autoMatchAll;
  el("mapView").querySelectorAll("select").forEach(sel=>{
    const src=sel.dataset.src, ok=sel.dataset.ok;
    sel.value=(MAP[src]||{})[ok]||"";
    sel.onchange=()=>saveMap(src,ok,sel.value);
  });
}

// ---- авто-підбір: наша категорія замовлення -> рекламована Google-категорія (корені слів, рус/укр) ----
const STEM=[
  ["кофт|толстовк|реглан|худ|свитшот|свитер|кардиган","кофта"],
  ["зим","зима"],["утепл","утепл"],["костюм","костюм"],
  ["бомбер","бомбер"],["анорак","анорак"],["ветров|витров","витров"],
  ["демисезон","демсез"],["парк","парка"],["пухов","пухов"],["куртк","куртка"],
  ["штан|брюк","штан"],["спорт","спорт"],["летн|литн","лит"],["весен|весн","весна"],["осен|осин","осинь"],
  ["футболк","футболка"],["жилет|безрукавк","жилет"],["сумк|сумочк|клатч","сумка"],
  ["мессендж|месендж","месендж"],["рюкзак","рюкзак"],["дорож","дорож"],["кошельк|гаман","гаман"],
  ["кроссовк|кросивк|кросовк|кед","кросивка"],["ботинк|черевик","черевик"],
  ["набор|набир","набор"],["шорт","шорт"],["рубашк|сороч","сорочка"],["кепк","кепка"],["панамк","панамка"],
  ["носк|шкарпет","шкарпетка"],["дитяч|детск","дитяч"],["одежд|одяг|взутт|обув","одяг"],
  ["плат","плаття"],["пижам","пижама"],["жиноч|женск","жин"]
];
function canon(tok){ for(let i=0;i<STEM.length;i++){ if(new RegExp(STEM[i][0]).test(tok)) return STEM[i][1]; } return tok; }
function normSet(s){
  s=(s||"").toLowerCase().replace(/[іїʼ'’]/g,"и").replace(/є/g,"е").replace(/ґ/g,"г");
  const stop=new Set(["мужские","мужская","мужской","мужчин","чоловичи","чоловича","чоловичий","и","та","для"]);
  return new Set(s.split(/[\s|\/_,\-–—+()]+/).filter(Boolean).filter(t=>!stop.has(t)).map(canon));
}
function jac(a,b){ let i=0; a.forEach(x=>{if(b.has(x))i++;}); const u=new Set([...a,...b]).size; return u?i/u:0; }
function autoMatchSrc(src){
  const adv=advCats(src).map(a=>({key:a.key,set:normSet(a.name)}));
  const orders=aggCats(src,null,null);
  const patch={};
  for(const ck in orders){
    if((MAP[src]||{})[ck]) continue;               // вже привʼязані не чіпаємо
    const oset=normSet(orders[ck].cat); let best=null,bs=0;
    for(const a of adv){ const s=jac(oset,a.set); if(s>bs){bs=s;best=a;} }
    if(best&&bs>=0.34) patch[ck]=best.key;
  }
  return patch;
}
async function autoMatchAll(){
  let n=0;
  for(const src of sources()){
    const patch=autoMatchSrc(src);
    const keys=Object.keys(patch); if(!keys.length) continue;
    MAP[src]=Object.assign(MAP[src]||{},patch); n+=keys.length;
    try{ await fetch(FB+"/shop-reports/ads-map2/"+enc(src)+".json",
      {method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});}catch(e){}
  }
  el("status").textContent="Авто-підбір: привʼязано "+n+" (перевір і поправ за потреби)";
  render();
}

async function saveMap(src,ok,gKey){
  MAP[src]=MAP[src]||{}; MAP[src][ok]=gKey||null;
  el("status").textContent="Збереження…";
  try{
    await fetch(FB+"/shop-reports/ads-map2/"+enc(src)+".json",
      {method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({[ok]:gKey||null})});
    el("status").textContent="Збережено ✓ "+new Date().toLocaleTimeString("uk-UA");
  }catch(e){ el("status").textContent="Помилка збереження"; }
}

function setRange(days){ const [,mx]=bounds(); if(!mx)return; const d=new Date(mx); d.setDate(d.getDate()-(days-1)); el("from").value=d.toISOString().slice(0,10); el("to").value=mx; render(); }
el("apply").onclick=render;
el("reload").onclick=loadData;
el("d7").onclick=()=>setRange(7);
el("d30").onclick=()=>setRange(30);
el("all").onclick=()=>{const [mn,mx]=bounds();el("from").value=mn||"";el("to").value=mx||"";render();};
el("vTable").onclick=()=>{el("vTable").classList.add("on");el("vMap").classList.remove("on");el("tableView").style.display="";el("mapView").style.display="none";render();};
el("vMap").onclick=()=>{el("vMap").classList.add("on");el("vTable").classList.remove("on");el("tableView").style.display="none";el("mapView").style.display="";render();};

loadData();
</script>
