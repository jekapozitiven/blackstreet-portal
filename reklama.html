<html lang="uk">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7F5; --card:#ffffff; --line:#E8E8E6; --line2:#E5E5E3; --text:#111; --muted:#8A8A8A; --faint:#C7C7C5;
    --accent:#1F6FEB; --green:#0E7C5A; --red:#C2453B; --orange:#E8820C; --violet:#7C3AED;
    --g-bg:rgba(14,124,90,.09); --o-bg:rgba(232,130,12,.11); --r-bg:rgba(194,69,59,.08); --bd-bg:rgba(31,111,235,.08);
    --mono:'JetBrains Mono',ui-monospace,monospace; --shadow:0 1px 2px rgba(17,17,17,.04),0 4px 16px rgba(17,17,17,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1340px;margin:0 auto;padding:22px 24px 40px}
  .back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;transition:color .15s}
  .back:hover{color:var(--accent)}
  h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12.5px;line-height:1.5;margin-bottom:20px;max-width:760px}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .seg{display:inline-flex;gap:2px;background:#EDEDEB;border:1px solid var(--line);border-radius:11px;padding:3px}
  .bar label{display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  input[type=date]{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 9px;font-size:13px;font-family:var(--mono);transition:border-color .15s}
  input[type=date]:focus{outline:0;border-color:var(--accent)}
  button{background:var(--accent);border:0;color:#fff;border-radius:10px;padding:9px 16px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(31,111,235,.25)}
  button:hover{filter:brightness(1.07)}
  button.ghost{background:var(--card);border:1px solid var(--line);color:var(--text);box-shadow:none}
  button.ghost:hover{border-color:var(--faint);background:#fafafa}
  .seg button.ghost{background:transparent;border:0;border-radius:8px;padding:7px 14px;color:var(--muted);font-weight:600}
  .seg button.ghost:hover{background:rgba(0,0,0,.04);color:var(--text)}
  .seg button.ghost.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.09)}
  button.ghost.on{border-color:var(--accent);color:var(--accent)}
  select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 7px;font-size:12px;max-width:230px;font-family:inherit}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--faint)}
  .kpi.k-ok::before{background:var(--green)} .kpi.k-bd::before{background:var(--accent)} .kpi.k-amb::before{background:var(--orange)}
  .kpi .l{color:var(--muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .kpi .v{font-size:23px;font-weight:800;margin-top:6px;font-family:var(--mono);letter-spacing:-.02em;line-height:1.1}
  .kpi-sub{font-size:11px;color:var(--muted);margin-top:5px;font-family:var(--mono)}

  .shop{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 4px 8px;margin-bottom:18px;overflow-x:auto;box-shadow:var(--shadow)}
  .shop h2{font-size:16px;font-weight:700;margin:14px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .shop h2 .t{color:var(--muted);font-size:12.5px;font-weight:500;font-family:var(--mono)}
  .shop h2 .t b{color:var(--text);font-weight:700}
  .shop h2 .t b.g{color:var(--green)} .shop h2 .t b.bd{color:var(--accent)}
  table{width:100%;border-collapse:collapse;min-width:860px}
  th,td{padding:9px 11px;text-align:right;border-top:1px solid var(--line);font-family:var(--mono);font-size:13px;white-space:nowrap}
  th{position:sticky;top:0;z-index:2;background:#fff;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;border-top:0;border-bottom:1px solid var(--line);font-family:inherit}
  td.name,th.name{text-align:left;font-family:inherit;white-space:normal}
  tr.tot td{border-top:2px solid var(--line2);font-weight:800}
  tr.nocat td.name{color:var(--orange)}
  tr.warn td{color:var(--orange)}
  .pct{color:var(--muted);font-weight:500} .g{color:var(--green)} .r{color:var(--red)} .o{color:var(--orange)} .bd{color:var(--accent)}
  .pct.g{color:var(--green)} .pct.o{color:var(--orange)} .pct.r{color:var(--red)}
  td.m{font-weight:700}
  td.m.g{color:var(--green)} td.m.o{color:var(--orange)} td.m.r{color:var(--red)} td.m.p{color:var(--violet)}
  .note{color:var(--muted);font-size:12px;margin:8px 4px}
  td.name.exp{cursor:pointer;user-select:none} td.name.exp:hover{color:var(--accent)}
  .caret{display:inline-block;width:14px;color:var(--faint);font-size:11px;transition:transform .14s}
  tr.open .caret{transform:rotate(90deg);color:var(--accent)}
  tr.camp{cursor:pointer} tr.camp td{background:#fff;font-weight:700;border-top:2px solid var(--line2)}
  tr.camp:hover td.name{color:var(--accent)}
  tr.camp td.name{color:var(--text);user-select:none}
  td.name.sub{padding-left:30px}
  tr.detail td{background:#fff;border-top:0;padding:4px 14px 14px;text-align:left}
  .ocard{display:flex;gap:12px;align-items:center;padding:9px 8px;border-top:1px solid var(--line);text-align:left}
  .ocard:first-child{border-top:0}
  .oimg{width:50px;height:50px;border-radius:10px;object-fit:cover;background:#f0f1f3;border:1px solid var(--line);flex:none}
  .oimg.noimg{background:#f0f1f3}
  .ocard.assigned{opacity:.55}
  select.passign,select.cassign{margin-left:auto;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12px;max-width:260px}
  .oinfo{min-width:0;flex:1}
  .oname{font-size:13px;line-height:1.35;margin-bottom:5px;font-weight:500}
  .oname a{color:var(--accent);text-decoration:none} .oname a:hover{text-decoration:underline}
  .omet{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:12px;color:var(--muted);align-items:center}
  .omet b{color:var(--text);font-weight:600}
  .omet .onum{color:var(--text)}
  .ap{font-weight:600;padding:1px 8px;border-radius:999px;font-size:11px}
  .omet .ap.g{color:var(--green);background:var(--g-bg)} .omet .ap.r{color:var(--red);background:var(--r-bg)}
  .maprow{display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line)}
  .maprow .gname{flex:1;font-size:13px} .maprow .gb{font-family:var(--mono);color:var(--muted);width:120px;text-align:right}
  .empty{color:var(--muted);font-size:12px;padding:8px 12px}
  .cfg{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .cfg label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
  .cfg input{background:#fff;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font-size:13px;width:170px;font-family:var(--mono)}
  .cfg input:focus{outline:0;border-color:var(--accent)}
  @media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html" target="_top">← На головну</a>
  <h1>Реклама — категорії та бюджет</h1>
  <div class="sub">Категорії = ті, що реально рекламуються в Google Ads (типи товару в кампаніях, по кожному магазину). Заявки/маржа з сайтів привʼязуються до них у вкладці «Прив'язка».</div>

  <div class="bar">
    <div class="seg">
      <button class="ghost" id="pToday">Сьогодні</button>
      <button class="ghost" id="pYest">Вчора</button>
      <button class="ghost" id="d7">7 днів</button>
      <button class="ghost" id="d15">15 днів</button>
      <button class="ghost" id="pThisM">Цей місяць</button>
      <button class="ghost" id="pLastM">Минулий місяць</button>
      <button class="ghost" id="all">Весь період</button>
    </div>
    <span style="width:6px"></span>
    <label>Від<input type="date" id="from"></label>
    <label>До<input type="date" id="to"></label>
    <button id="apply">Показати</button>
    <span style="flex:1"></span>
    <div class="seg">
      <button class="ghost on" id="vTable">Таблиця</button>
      <button class="ghost" id="vMap">Прив'язка</button>
    </div>
    <button class="ghost" id="cfgBtn">⚙ Налаштування</button>
    <button class="ghost" id="reload">↻</button>
  </div>

  <div class="cfg" id="cfgPanel" style="display:none">
    <label>Викуп % (ручний, порожньо = рахувати авто)<input type="number" id="cfgBuyout" min="0" max="100" step="1" placeholder="напр. 72"></label>
    <label>Середня сума повернення, ₴ (доставка туди-назад)<input type="number" id="cfgReturn" min="0" step="1" placeholder="напр. 120"></label>
    <label>Ставка КЦ за апрув, ₴<input type="number" id="cfgZp" min="0" step="1" placeholder="24"></label>
    <button id="cfgSave">Зберегти</button>
    <span class="note" id="cfgNote"></span>
  </div>

  <div id="tableView">
    <div class="kpis" id="kpis"></div>
    <div id="shops"></div>
  </div>
  <div id="mapView" style="display:none"></div>
  <div class="note" id="status">Завантаження…</div>
</div>

<script>
const FB = "https://owner-portal-1649e-default-rtdb.europe-west1.firebasedatabase.app";
const ORDER = ["Сайт-Black-street","Сайт-Bonna-shop","Хор-Blink","Хор-Blink-FB","Сайт-Black-street-FB"];
// ADS[src][day][workerCatKey]={cat,leads,approved,sum,margin,upsSum}  — наші замовлення по категоріях воркера
// GCAT[src][gKey]={name,"дата":витрати}                               — рекламовані категорії Google + бюджет
// MAP[src][workerCatKey]=gKey                                          — наша категорія замовлення -> рекламована категорія Google
// GCATCAMP[src][gKey]={cat,camp,lastDate}                              — поточна кампанія категорії (авто з Google Ads)
// ads-ord[src][day][oid]={catKey,catName,approved,sum,upsSum,margin,drop,items} — поордерна деталізація (для карток)
let ADS = {}, GCAT = {}, MAP = {}, GCATCAMP = {}, GCATCAMPDAY = {}, GCATCAMPCOST = {};
let PHONEORD = {}, PHONEASSIGN = {};   // ads-ord/Телефон (ручні заказы) та їх ручне призначення в кампанії
let CATASSIGN = {};                     // ads-catcamp-assign[src][catKey]=назва кампанії — ручне призначення категорій «без реклами»
let SKUCAT = {}, ORDCAT = {};                        // ads-sku-cat[src][sku]=advCatKey — ручне призначення категорії по артикулу (для «без категорії»)
let ALLCAMPS = [];                      // [{src,camp}] — усі кампанії для випадаючого списку
const PHONE_SRC = "Телефон";
let ROWUID = 0, ROWMETA = {}, ORDCACHE = {};   // ROWMETA[uid]={src,wkeys}; ORDCACHE[src]=дерево ads-ord
// налаштування розрахунку (редагуються, зберігаються в ads-settings)
let SETTINGS = {buyout:null, returnCost:0, zpRate:24};   // buyout% ручний (null=авто), сума повернення ₴, ставка КЦ ₴/апрув

const fmt = n => Math.round(n||0).toLocaleString("uk-UA");
const el = id => document.getElementById(id);
const enc = encodeURIComponent; let FBBUD={}, CURF="", CURT=""; function isFbSrc(s){return /-FB$/i.test(String(s||""));} function shopTitle(s){return s==="Сайт-Black-street-FB"?"Black-street - FB":s;} function fbBudget(src,key,f,t){var o=((FBBUD[src]||{})[key]||{});return +o[(f||"")+"_"+(t||"")]||0;} async function saveFbBudget(src,key,f,t,val){FBBUD[src]=FBBUD[src]||{};FBBUD[src][key]=FBBUD[src][key]||{};var pk=(f||"")+"_"+(t||"");var v=parseFloat(val);var body=(isNaN(v)||v<0)?null:v;if(body===null){delete FBBUD[src][key][pk];}else{FBBUD[src][key][pk]=v;}try{await fetch(FB+"/shop-reports/ads-fb-budget/"+enc(src)+"/"+enc(key)+"/"+enc(pk)+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});}catch(e){}render();}

async function loadData(){ try{ FBBUD = await fetch(FB+"/shop-reports/ads-fb-budget.json").then(r=>r.json())||{}; }catch(e){ FBBUD={}; }
  el("status").textContent = "Завантаження…";
  const [a,g,m,cc,ccd,ccc,st,po,pa,ca,sk] = await Promise.all([
    fetch(FB+"/shop-reports/ads.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-google-cat.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-map2.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-google-catcamp.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-google-catcampday.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-google-catcampcost.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-settings.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-ord.json").then(r=>r.json()),   // весь дерево пер-ордерів (усі магазини + Телефон)
    fetch(FB+"/shop-reports/ads-phone-assign.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-catcamp-assign.json").then(r=>r.json()),
    fetch(FB+"/shop-reports/ads-sku-cat.json").then(r=>r.json()),   // ручні призначення категорії по артикулу
  ]);
  ADS=a||{}; GCAT=g||{}; MAP=m||{}; GCATCAMP=cc||{}; GCATCAMPDAY=ccd||{}; GCATCAMPCOST=ccc||{};
  const aoTree=po||{};
  ORDCACHE=aoTree;                       // пер-ордери кешуємо одразу (щоб показати номери заказів «без реклами»)
  PHONEORD=aoTree[PHONE_SRC]||{};
  PHONEASSIGN=pa||{}; CATASSIGN=(ca||{}); SKUCAT=(sk||{}); ALLCAMPS=buildAllCamps();
  if(st&&typeof st==="object"){ SETTINGS={buyout:(st.buyout==null?null:+st.buyout), returnCost:+st.returnCost||0, zpRate:(st.zpRate==null?24:+st.zpRate)}; }
  // заповнити поля панелі
  el("cfgBuyout").value = SETTINGS.buyout==null?"":SETTINGS.buyout;
  el("cfgReturn").value = SETTINGS.returnCost||"";
  el("cfgZp").value = SETTINGS.zpRate==null?"":SETTINGS.zpRate;
  const [mn,mx]=bounds();
  // відновити збережений період (щоб при оновленні сторінки не скидалося)
  let sv=null; try{ sv=JSON.parse(localStorage.getItem("rek-period")||"null"); }catch(e){}
  if(sv&&sv.from){ el("from").value=sv.from; } else if(mn&&!el("from").value){ el("from").value=mn; }
  if(sv&&sv.to){ el("to").value=sv.to; } else if(mx&&!el("to").value){ el("to").value=mx; }
  render();
}
// поордерная детализация магазина (загружаем по требованию, кэшируем)
async function loadOrders(src){
  if(ORDCACHE[src]) return ORDCACHE[src];
  let tree={};
  try{ tree=await fetch(FB+"/shop-reports/ads-ord/"+enc(src)+".json").then(r=>r.json())||{}; }catch(e){}
  ORDCACHE[src]=tree||{}; return ORDCACHE[src];
}

function bounds(){
  let mn=null,mx=null;
  for(const s in ADS) for(const d in ADS[s]){ if(!mn||d<mn)mn=d; if(!mx||d>mx)mx=d; }
  for(const s in GCAT) for(const k in GCAT[s]) for(const d in GCAT[s][k]){ if(d==="name")continue; if(!mn||d<mn)mn=d; if(!mx||d>mx)mx=d; }
  return [mn,mx];
}
function sources(){
  const s=new Set([...Object.keys(ADS),...Object.keys(GCAT),...ORDER]);
  s.delete(PHONE_SRC);   // «Телефон» — не звичайний магазин, рендериться окремою секцією
  return [...s].sort((a,b)=>{const ia=ORDER.indexOf(a),ib=ORDER.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib);});
}
// усі кампанії всіх магазинів — для випадаючого списку призначення телефонних заказів
function buildAllCamps(){
  const out=[], seen={};
  const add=(src,cn)=>{ if(!cn)return; const key=src+"\u0001"+cn; if(!seen[key]){ seen[key]=1; out.push({src,camp:cn}); } };
  // 1) з бюджетів по кампаніях
  for(const src in GCATCAMPCOST){ const cc=GCATCAMPCOST[src]||{};
    for(const ck in cc){ const camps=(cc[ck]&&cc[ck].camps)||{};
      for(const mk in camps){ add(src,(camps[mk]&&camps[mk].camp)||mk); } } }
  // 2) з поточних кампаній категорій (повніший список — не всі кампанії мають рядок у catcampcost)
  for(const src in GCATCAMP){ const cc=GCATCAMP[src]||{};
    for(const ck in cc){ add(src,(cc[ck]&&cc[ck].camp)); } }
  out.sort((a,b)=> a.src===b.src ? a.camp.localeCompare(b.camp,"uk") : a.src.localeCompare(b.src,"uk"));
  return out;
}
// телефонні заказы за період -> масив {oid,day,...}
function phoneInRange(f,t){
  const out=[];
  for(const day in PHONEORD){ if(!inRange(day,f,t))continue;
    for(const oid in PHONEORD[day]){ const o=PHONEORD[day][oid]; if(o) out.push(Object.assign({oid,day},o)); } }
  return out;
}
function phoneAssignOf(oid){ const a=PHONEASSIGN[oid]; return (a&&a.src&&a.camp)?a:null; }
// пер-ордери магазину за категорією та періодом (з ORDCACHE) — щоб показати номери заказів «без реклами»
function catOrders(src,wc,f,t){
  const tree=ORDCACHE[src]||{}, out=[];
  for(const day in tree){ if(!inRange(day,f,t))continue; const ords=tree[day];
    for(const oid in ords){ const o=ords[oid]; if(o && effCat(src,o).ck===wc) out.push(Object.assign({oid,day},o)); } }
  return out;
}
function inRange(d,f,t){ return (!f||d>=f)&&(!t||d<=t); }
function sumCost(obj,f,t){ let s=0; for(const k in obj){ if(k==="name")continue; if(inRange(k,f,t)) s+=+obj[k]||0; } return s; }
// кампанія категорії ЗА ПЕРІОД: та, де вона крутилась у вибрані дні (з ads-google-catcampday),
// зважена розходом дня. Якщо денних даних за період нема — поточна кампанія (ads-google-catcamp).
function campForPeriod(src,catKey,f,t){
  const day=(GCATCAMPDAY[src]||{})[catKey];
  if(day){
    const cost=(GCAT[src]||{})[catKey]||{};
    const tally={}; let anyDay=null;
    for(const d in day){ if(d==="name")continue; if(!inRange(d,f,t))continue;
      const c=day[d]; if(!c)continue; if(!anyDay)anyDay=c;
      tally[c]=(tally[c]||0)+(+(cost[d]||0)); }
    let best=null,bestv=-1; for(const c in tally){ if(tally[c]>bestv){bestv=tally[c];best=c;} }
    if(best&&bestv>0) return best;      // кампанія з найбільшим розходом у періоді
    if(anyDay) return anyDay;           // розходу 0, але кампанія в періоді була
  }
  return (GCATCAMP[src]&&GCATCAMP[src][catKey]&&GCATCAMP[src][catKey].camp)||null;
}

// рекламовані категорії магазину (з Google Ads) — тільки вони, окремо по магазину
function advCats(src){if(isFbSrc(src)){var seen={},a=ADS[src]||{};MAP[src]=MAP[src]||{};for(var day in a){for(var k in a[day]){if(!seen[k])seen[k]=a[day][k].cat||k;MAP[src][k]=k;}}return Object.keys(seen).map(function(k){return{key:k,name:seen[k]};}).sort(function(a,b){return a.name.localeCompare(b.name,"uk");});}
  const g=GCAT[src]||{};
  return Object.keys(g).map(k=>({key:k,name:g[k].name||k})).sort((a,b)=>a.name.localeCompare(b.name,"uk"));
}
// наші категорії замовлень за період: рахуємо НАПРЯМУ з по-заказних ads-ord (ORDCACHE),
// а не зі зводу ads. Так таблиця й розкриті заказы з одного джерела → рахунки завжди
// збігаються, а кампанія береться реальна (та, що крутила категорію в цьому періоді).
// workerKey -> {key,cat,leads,approved,sold,refused,sum,margin,upsSum,camps:{camp->{...}}}
// ефективна категорія заказу з урахуванням ручного призначення по артикулу (SKUCAT)
function effCat(src,o){
  let ck=o.catKey||"_no_cat", cn=o.catName||ck;
  const sku=(o.items&&o.items[0]&&o.items[0].sku)||"";
  const ex=(o.ext!=null?String(o.ext):""); const ov=(ex&&ORDCAT[src]&&ORDCAT[src][ex])||(sku&&SKUCAT[src]&&SKUCAT[src][sku]);
  if(ov){ ck="_ovr_"+ov; cn=(GCAT[src]&&GCAT[src][ov]&&GCAT[src][ov].name)||ov;
    MAP[src]=MAP[src]||{}; MAP[src][ck]=ov; }   // щоб рендер відправив заказ у рекламну категорію ov (і її кампанію)
  return {ck,cn};
}
function aggCats(src,f,t){if(isFbSrc(src)){var fbOut={},a=ADS[src]||{};for(var day in a){if(!inRange(day,f,t))continue;for(var k in a[day]){var c=a[day][k];var cell=fbOut[k]||(fbOut[k]={key:k,cat:c.cat||k,leads:0,approved:0,sold:0,refused:0,sum:0,margin:0,upsSum:0,camps:{}});cell.leads+=c.leads||0;cell.approved+=c.approved||0;cell.sold+=c.sold||0;cell.refused+=c.refused||0;cell.sum+=c.sum||0;cell.margin+=c.margin||0;cell.upsSum+=c.upsSum||0;var cc=c.camps||{};for(var mk in cc){var sc=cc[mk];var dd=cell.camps[mk]||(cell.camps[mk]={camp:sc.camp||"",leads:0,approved:0,sold:0,refused:0,sum:0,margin:0,upsSum:0});dd.leads+=sc.leads||0;dd.approved+=sc.approved||0;dd.sold+=sc.sold||0;dd.refused+=sc.refused||0;dd.sum+=sc.sum||0;dd.margin+=sc.margin||0;dd.upsSum+=sc.upsSum||0;}}}return fbOut;}
  const out={}, tree=(ORDCACHE[src]||{});
  for(const day in tree){ if(!inRange(day,f,t))continue;
    const ords=tree[day];
    for(const oid in ords){ const o=ords[oid]; if(!o)continue;
      const ec=effCat(src,o); const ck=ec.ck, cn=ec.cn;
      const cell=out[ck]||(out[ck]={key:ck,cat:cn,leads:0,approved:0,sold:0,refused:0,sum:0,margin:0,upsSum:0,camps:{}});
      const ap=+o.approved||0, sl=+o.sold||0, rf=+o.refused||0, sm=+o.sum||0, mg=+o.margin||0, up=+o.upsSum||0;
      cell.leads++; cell.approved+=ap; cell.sold+=sl; cell.refused+=rf; cell.sum+=sm; cell.margin+=mg; cell.upsSum+=up;
      const camp=o.camp||""; const mk=camp||"_nocamp";
      const d=cell.camps[mk]||(cell.camps[mk]={camp:camp,leads:0,approved:0,sold:0,refused:0,sum:0,margin:0,upsSum:0});
      d.leads++; d.approved+=ap; d.sold+=sl; d.refused+=rf; d.sum+=sm; d.margin+=mg; d.upsSum+=up;
    }}
  return out;
}

      if(!(m[wc]&&advSet.has(m[wc]))){

    let body, leftover=[];   // leftover — категорії «без реклами», що лишились без кампанії (для ручного вибору)

    if(!adv.length){
      body=`<tr><td class="empty" colspan="14">${isFbSrc(src)?"Поки немає заявок з Facebook — кампанії та заявки підтягнуться автоматично, коли підуть замовлення.":"Немає рекламованих категорій. Додай Google Ads-скрипт у цей акаунт — категорії підтягнуться самі."}</td></tr>`;
    } else if(grouped){
      const campVals=Object.values(cc).map(x=>x&&x.camp).filter(Boolean);
      const catchAll=campVals.find(n=>{const z=(n||"").toLowerCase();
        return z.indexOf("товар")>=0 && (z.indexOf("все")>=0||z.indexOf("всі")>=0||z.indexOf("all")>=0);})||null;
      // рядок = (рекламована категорія × кампанія). Одна категорія в 2 кампаніях -> 2 рядки.
      const SEP="�", rowsMap={};
      const ensureRow=(advKey,nm,camp)=>{const rk=advKey+SEP+camp; let r=rowsMap[rk];

      // 1) бюджет по кампаніях: з ads-google-catcampcost; якщо нема — стара єдина кампанія за період

          for(const dd in dys){ if(inRange(dd,f,t)) b+=+dys[dd]||0; }

// чи належить телефонний заказ (за orderSource-магазином) цьому джерелу-магазину
function phoneShopMatches(src,shop){
  if(!shop) return false;
  const s=(src||"").toLowerCase(), h=(shop||"").toLowerCase();
  if(h.indexOf("black")>=0||h.indexOf("блек")>=0||h.indexOf("блэк")>=0) return s.indexOf("black")>=0;
  if(h.indexOf("bonna")>=0||h.indexOf("бонна")>=0) return s.indexOf("bonna")>=0;
  if(h.indexOf("blink")>=0||h.indexOf("блін")>=0||h.indexOf("блин")>=0) return s.indexOf("blink")>=0 && s.indexOf("fb")<0;
  return false;
}

// розрахунок по налаштуваннях: викуп (ручний або авто), ЗП, повернення, чистий прибуток
function calcNet(r){
  const fin=(r.sold||0)+(r.refused||0);
  const hasBuy=(SETTINGS.buyout!=null)||fin>0;
  const bo=(SETTINGS.buyout!=null)?(+SETTINGS.buyout/100):(fin?(r.sold||0)/fin:0);
  const appr=r.approved||0;
  const zp=appr*(+SETTINGS.zpRate||0);                          // ЗП = апрув × ставка
  const ret=appr*(1-bo)*(+SETTINGS.returnCost||0);             // повернення = апрув × (1−викуп) × сума
  const vyr=(r.margin||0)*bo;                                   // валова × викуп
  const net=vyr-(r.budget||0)-zp-ret;                          // чистий прибуток
  return {fin,hasBuy,bo,zp,ret,net};
}
// пороги кольору: червоний < warn, помаранчевий warn..good, зелений >= good
function clr(v,warn,good){ return v>=good?'g':(v>=warn?'o':'r'); }
// ROAS: <5 червоний · 5–10 помаранчевий · 10–15 зелений · >15 фіолетовий
function roasClass(x){ return x<5?'r':(x<10?'o':(x<=15?'g':'p')); }
// ROI %: <80 червоний · 80–100 помаранчевий · 101–150 зелений · >150 фіолетовий
function roiClass(x){ return x<80?'r':(x<=100?'o':(x<=150?'g':'p')); }
// формує набір комірок метрик (однаковий для категорії і для рядка-кампанії)
function metricCells(r){
  const apr=r.leads?Math.round(r.approved/r.leads*100):0;
  const d=calcNet(r);
  const roas=r.budget?(r.sum||0)/r.budget:0;
  const roi=r.budget?d.net/r.budget:0;
  const boP=Math.round(d.bo*100), roiP=Math.round(roi*100);
  const cpl=r.leads?r.budget/r.leads:0;        // ціна заявки = бюджет / заявки
  const cpa=r.approved?r.budget/r.approved:0;  // ціна заказу = бюджет / апрув
  return `<td>${fmt(r.leads)}</td>
    <td>${fmt(r.approved)} <span class="pct ${clr(apr,70,85)}">${apr}%</span></td>
    <td class="g">${fmt(r.margin)}</td>
    <td class="m ${d.hasBuy?clr(boP,50,70):''}">${d.hasBuy?boP+'%':"—"}</td>
    <td class="bd">${r.fbSrc?`<input type="number" min="0" placeholder="0" style="width:72px;text-align:right" value="${r.budget||''}" onclick="event.stopPropagation()" onchange="saveFbBudget('${r.fbSrc}','${r.fbKey}',CURF,CURT,this.value)">`:(r.budget?fmt(r.budget):"—")}</td>
    <td class="pct">${(r.budget&&r.leads)?fmt(cpl):"—"}</td>
    <td class="pct">${(r.budget&&r.approved)?fmt(cpa):"—"}</td>
    <td class="${d.zp?'r':''}">${d.zp?fmt(d.zp):"—"}</td>
    <td class="${d.ret?'r':''}">${d.ret?fmt(d.ret):"—"}</td>
    <td class="m ${r.budget?roasClass(roas):''}">${r.budget?roas.toFixed(2)+'×':"—"}</td>
    <td class="m ${(r.budget&&d.hasBuy)?roiClass(roiP):''}">${(r.budget&&d.hasBuy)?roiP+'%':"—"}</td>
    <td class="m net ${d.hasBuy?(d.net>=0?'g':'r'):''}">${d.hasBuy?fmt(d.net):"—"}</td>
    <td class="g">${fmt(r.upsSum)}</td>`;
}

async function fillOrders(uid){
  const meta=ROWMETA[uid]; const box=el("box-"+uid); if(!meta||!box)return;
  box.innerHTML=`<span class="note">Завантаження…</span>`;
  const f=el("from").value, t=el("to").value;
  const rows=[];
  if(meta.phoneOids){   // рядок «📞 Телефонні» — беремо призначені телефонні заказы
    const set=new Set(meta.phoneOids);
    for(const day in PHONEORD){ if(!inRange(day,f,t))continue; const ords=PHONEORD[day];
      for(const oid in ords){ if(set.has(oid)&&ords[oid]) rows.push(Object.assign({day},ords[oid])); } }
  } else {
    const tree=await loadOrders(meta.src); const wk=new Set(meta.wkeys);
    const camps=Array.isArray(meta.camps)?new Set(meta.camps):null;   // null = всі кампанії (unmapped/стара таблиця)
    for(const day in tree){ if(!inRange(day,f,t))continue; const ords=tree[day];
      for(const oid in ords){ const o=ords[oid];
        if(o&&wk.has(effCat(meta.src,o).ck)&&(!camps||camps.has(o.camp||""))) rows.push(Object.assign({day},o)); } }
    // Фолбэк: якщо строгий фільтр по кампанії дав 0 (агрегат «ads» розійшовся з ads-ord
    // по полю camp), показуємо всі заказы цієї категорії за період — щоб заказы не зникали.
    if(!rows.length){
      for(const day in tree){ if(!inRange(day,f,t))continue; const ords=tree[day];
        for(const oid in ords){ const o=ords[oid];
          if(o&&wk.has(effCat(meta.src,o).ck)) rows.push(Object.assign({day},o)); } }
    }
  }
  rows.sort((a,b)=> a.day<b.day?1:a.day>b.day?-1:0);
  const src=meta.src;
  box.innerHTML = rows.length
    ? rows.map(o=>cardHtml(o,src)).join("")+`<div class="note" style="margin-top:6px">${rows.length} заказ(ів) за період</div>`
    : `<span class="note">Немає заказів за період.</span>`;
  box.querySelectorAll('select.skucat').forEach(s=>{
    s.onchange=(e)=>{ e.stopPropagation(); setSkuCat(s.dataset.src, s.dataset.sku, s.value); };
    s.onclick=(e)=>e.stopPropagation();   // щоб клік по селекту не згортав рядок
  });
}

  const aab=el("autoAllBtn"); if(aab) aab.onclick=()=>autoMatchAll(true);
  el("mapView").querySelectorAll("select").forEach(sel=>{
    const src=sel.dataset.src, ok=sel.dataset.ok;
    sel.value=(MAP[src]||{})[ok]||"";
    sel.onchange=()=>saveMap(src,ok,sel.value);
  });
}

// ---- авто-підбір: наша категорія замовлення -> рекламована Google-категорія (корені слів, рус/укр) ----
const STEM=[
  ["мужск|мужчин|чолович","муж"],       // рід — важливий: відрізняє "зимние куртки" від "мужские зимние куртки"
  ["женск|жиноч","жен"],
  ["кофт|толстовк|реглан|худ|свитшот|свитер|кардиган","кофта"],
  ["зим","зима"],["утепл","утепл"],["костюм","костюм"],
  ["бомбер","бомбер"],["анорак","анорак"],["ветров|витров","витров"],
  ["демисезон","демсез"],["парк","парка"],["пухов","пухов"],["куртк","куртка"],
  ["штан|брюк","штан"],["спорт","спорт"],["летн|литн","лит"],["весен|весн","весна"],["осен|осин","осинь"],
  ["футболк","футболка"],["жилет|безрукавк","жилет"],["сумк|сумочк|клатч","сумка"],
  ["мессендж|месендж","месендж"],["рюкзак","рюкзак"],["дорож","дорож"],["кошельк|гаман","гаман"],
  ["кроссовк|кросивк|кросовк|кед","кросивка"],["ботинк|черевик","черевик"],
  ["набор|набир","набор"],["шорт","шорт"],["рубашк|сороч","сорочка"],["кепк","кепка"],["панамк","панамка"],
  ["носк|шкарпет","шкарпетка"],["дитяч|детск","дитяч"],["одежд|одяг|взутт|обув","одяг"],
  ["плат","плаття"],["пижам","пижама"]
];
function canon(tok){ for(let i=0;i<STEM.length;i++){ if(new RegExp(STEM[i][0]).test(tok)) return STEM[i][1]; } return tok; }
function normSet(s){
  s=(s||"").toLowerCase().replace(/[іїʼ'’]/g,"и").replace(/є/g,"е").replace(/ґ/g,"г");
  const stop=new Set(["и","та","для","з","на"]);   // рід НЕ викидаємо — він значущий
  return new Set(s.split(/[\s|\/_,\-–—+()]+/).filter(Boolean).filter(t=>!stop.has(t)).map(canon));
}
function jac(a,b){ let i=0; a.forEach(x=>{if(b.has(x))i++;}); const u=new Set([...a,...b]).size; return u?i/u:0; }
function autoMatchSrc(src,overwrite){
  const adv=advCats(src).map(a=>({key:a.key,set:normSet(a.name)}));
  const orders=aggCats(src,null,null);
  const patch={};
  for(const ck in orders){
    if(!overwrite && (MAP[src]||{})[ck]) continue;   // без перезапису — вже привʼязані не чіпаємо
    const oset=normSet(orders[ck].cat); let best=null,bs=0;
    for(const a of adv){ const s=jac(oset,a.set); if(s>bs){bs=s;best=a;} }
    if(best&&bs>=0.34) patch[ck]=best.key;
  }
  return patch;
}
async function autoMatchAll(overwrite){
  let n=0;
  for(const src of sources()){
    const patch=autoMatchSrc(src,overwrite);
    const keys=Object.keys(patch); if(!keys.length) continue;
    MAP[src]=Object.assign(MAP[src]||{},patch); n+=keys.length;
    try{ await fetch(FB+"/shop-reports/ads-map2/"+enc(src)+".json",
      {method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(patch)});}catch(e){}
  }
  el("status").textContent=(overwrite?"Переприв'язано заново: ":"Авто-підбір: привʼязано ")+n+" (перевір і поправ за потреби)";
  render();
}

async function saveMap(src,ok,gKey){
  MAP[src]=MAP[src]||{}; MAP[src][ok]=gKey||null;
  el("status").textContent="Збереження…";
  try{
    await fetch(FB+"/shop-reports/ads-map2/"+enc(src)+".json",
      {method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({[ok]:gKey||null})});
    el("status").textContent="Збережено ✓ "+new Date().toLocaleTimeString("uk-UA");
  }catch(e){ el("status").textContent="Помилка збереження"; }
}

const isoLocal=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());};
function setPeriod(f,t){ el("from").value=f; el("to").value=t; render(); }
function setRange(days){ const t=new Date(); const f=new Date(); f.setDate(f.getDate()-(days-1)); setPeriod(isoLocal(f),isoLocal(t)); }
el("apply").onclick=render;
el("reload").onclick=loadData;
el("pToday").onclick=()=>{const t=isoLocal(new Date());setPeriod(t,t);};
el("pYest").onclick=()=>{const d=new Date();d.setDate(d.getDate()-1);const t=isoLocal(d);setPeriod(t,t);};
el("d7").onclick=()=>setRange(7);
el("d15").onclick=()=>setRange(15);
el("pThisM").onclick=()=>{const n=new Date();setPeriod(isoLocal(new Date(n.getFullYear(),n.getMonth(),1)),isoLocal(n));};
el("pLastM").onclick=()=>{const n=new Date();setPeriod(isoLocal(new Date(n.getFullYear(),n.getMonth()-1,1)),isoLocal(new Date(n.getFullYear(),n.getMonth(),0)));};
el("all").onclick=()=>{const [mn,mx]=bounds();el("from").value=mn||"";el("to").value=mx||"";render();};
el("cfgBtn").onclick=()=>{const p=el("cfgPanel");p.style.display=(p.style.display==="none"?"":"none");};
el("cfgSave").onclick=async ()=>{
  const b=el("cfgBuyout").value.trim();
  SETTINGS.buyout = b===""?null:Math.max(0,Math.min(100,+b||0));
  SETTINGS.returnCost = +el("cfgReturn").value||0;
  SETTINGS.zpRate = el("cfgZp").value===""?24:(+el("cfgZp").value||0);
  el("cfgNote").textContent="Збереження…";
  try{ await fetch(FB+"/shop-reports/ads-settings.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(SETTINGS)});
       el("cfgNote").textContent="Збережено ✓ "+new Date().toLocaleTimeString("uk-UA"); }
  catch(e){ el("cfgNote").textContent="Помилка збереження"; }
  render();
};
el("vTable").onclick=()=>{el("vTable").classList.add("on");el("vMap").classList.remove("on");el("tableView").style.display="";el("mapView").style.display="none";render();};
el("vMap").onclick=()=>{el("vMap").classList.add("on");el("vTable").classList.remove("on");el("tableView").style.display="none";el("mapView").style.display="";render();};

loadData();
